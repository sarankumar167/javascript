<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo1"></p>
    <p id="demo4"></p>
    <script>
       let count=0;

       while(count < 5){
        let code = Number(prompt("Enter Product Code"));
        let quantity = Number(prompt("Enter Quantity"));

        if( code < 1 || code > 3){
            document.getElementById("demo1").innerHTML="Invalid input code";
            continue;
        }

        let product;
        let price;
        let total;
        switch(code){
            case 1:
                product="Apple";
                price=30;
                break;

                case 2:
                product="Banana";
                price=10;
                break;

                case 3:
                product="Mango";
                price=50;
                break;
        }
        
                total = price * quantity;
                
            
        if(total > 100){
            document.getElementById("demo4").innerHTML+=`Product: ${product},Total: ${total},High Purchase <br>`;

        }
        else{
            document.getElementById("demo4").innerHTML+=`Product: ${product},Total: ${total},Normal Purchase <br>`;
        }
        count++;
       }
    </script>
    
</body>
</html>
