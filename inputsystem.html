<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let i;
       
        for(i=1; i<=5; i++){
             let num= Number(prompt("Enter a number from 1 to 5"))
            

            if(num>5 || num<0){
                console.log("invalid input");
                
                continue;
            }
            switch(num){
                case 1:
                console.log("One");
                break;

                case 2:
                    console.log("Two");
                    break;

                     case 3:
                    console.log("Three");
                    break;

                     case 4:
                    console.log("Four");
                    break;

                     case 5:
                    console.log("Five");
                    break;
            }

            if(num == 3){
                console.log("You guessed it right!")
                break;
            }
            else{
                console.log("Wrong guess. Try again")
            }

            if(i == 5){
                console.log("Game over")
            }
        }
    </script>
</body>
</html>
